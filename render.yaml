services:
  - type: web
    name: cuan-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/auth-api.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

